name: Build LiangYi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Extract prebuilt components from official 0.5.4 release
        run: |
          set -e
          curl -L -o twoyi_official.apk https://github.com/twoyi/twoyi/releases/download/0.5.4/twoyi_0.5.4-03211927-release.apk
          mkdir -p apk_extract app/src/main/assets
          unzip -o twoyi_official.apk -d apk_extract > /dev/null
          # rootfs.7z + rom.ini (the Android 8.1 ROM; manager app & superuser live inside it)
          cp apk_extract/assets/rootfs.7z app/src/main/assets/ 2>/dev/null || echo "WARN: rootfs.7z missing"
          cp apk_extract/assets/rom.ini app/src/main/assets/ 2>/dev/null || true
          # libtwoyi.so (Rust component, ROM source not open)
          ls apk_extract/lib/arm64-v8a/
          mkdir -p app/src/main/jniLibs/arm64-v8a
          for f in apk_extract/lib/arm64-v8a/*.so; do
            bn=$(basename "$f")
            if [ ! -f "app/src/main/jniLibs/arm64-v8a/$bn" ]; then
              cp "$f" app/src/main/jniLibs/arm64-v8a/
            fi
          done

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" liangyi-release.apk
          echo "APK_PATH=liangyi-release.apk" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liangyi-apk
          path: liangyi-release.apk

      - name: Create/Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0-liangyi
          name: 两仪 LiangYi v1.0
          body: |
            两仪（LiangYi）定制版 APK。
            - 内置官方 8.1 rootfs（管理器、超级管理者 root 均保留）
            - 设置中新增「下载自定义 ROM」：多加速镜像自动换源 + 缓存
            - 支持从加速镜像下载 7z ROM 并自动安装
          files: liangyi-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
